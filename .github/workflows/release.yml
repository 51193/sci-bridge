name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须以 v 开头，例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  release:
    name: Build and publish the Windows exe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' 不合法，应形如 v1.2.3"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Publish SciBridge.exe
        run: |
          # The git tag is the only version authority. Do not add a version
          # literal to C#; the project's 0.0.0-dev value is only a local fallback.
          dotnet publish src/SciBridge.App/SciBridge.App.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -o "$RUNNER_TEMP/publish/app"

      - name: Assemble release files
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/publish/app/SciBridge.exe"
          test -f "$APP"

          mkdir -p release
          # Stable asset name: the app updates itself, so the download name
          # must not carry a version. The tag still supplies the version.
          cp "$APP" "release/SciBridge-win11.exe"
          (cd release && sha256sum SciBridge-win11.exe > SHA256SUMS.txt)

          ls -lh release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf 'Windows 11 x64 自包含单文件，无需安装 Python 或 .NET。\n\n'
            printf -- '- `SciBridge-win11.exe`：主程序（稳定文件名）\n'
            printf -- '- `SHA256SUMS.txt`：SHA-256 校验和（应用内更新器使用）\n\n'
            printf '首次运行可能出现 SmartScreen 提示。\n'
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "SciBridge $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

          gh release view "$TAG" --json url,tagName,assets \
            --jq '"release: \(.url)\nassets: \(.assets | length)"'
